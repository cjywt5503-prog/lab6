global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: order-coordinator
    static_configs:
      - targets: ['order-sample-service:8001']
  - job_name: shard-primary
    static_configs:
      - targets: ['shard-0-primary:8004']
        labels: {shard_id: '0'}
      - targets: ['shard-1-primary:8004']
        labels: {shard_id: '1'}
  - job_name: shard-replica
    static_configs:
      - targets: ['shard-0-replica:8004']
        labels: {shard_id: '0'}
      - targets: ['shard-1-replica:8004']
        labels: {shard_id: '1'}
  - job_name: biolims-services
    static_configs:
      - targets: ['assay-execution-service:8002', 'validation-report-service:8003']
